modules:
  prefix_inspections:
    ./lib:
      - LIBRARY_PATH
      - LD_LIBRARY_PATH
    ./lib64:
      - LIBRARY_PATH
      - LD_LIBRARY_PATH
    ./include:
      - C_INCLUDE_PATH
      - CPLUS_INCLUDE_PATH
      - INCLUDE

  default:
    enable:
      - tcl

    tcl:
      all:
        autoload: none
        # template: modules/modulefile_fugaku_log.tcl

      projections:
        all: '{name}/{version}-{compiler.name}-{compiler.version}'
