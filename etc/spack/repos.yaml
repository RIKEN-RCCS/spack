# -------------------------------------------------------------------------
# This is the default spack repository configuration. It includes the
# builtin spack package repository.
#
# Users can override these settings by editing the following files.
#
# Per-spack-instance settings (overrides defaults):
#   $SPACK_ROOT/etc/spack/repos.yaml
#
# Per-user settings (overrides default and site settings):
#   ~/.spack/repos.yaml
# -------------------------------------------------------------------------
repos:
  fugaku.rccs: $spack/var/spack/fugaku-packages/repos/spack_repo/fugaku/rccs
  fugaku.rist: $spack/var/spack/fugaku-packages/repos/spack_repo/fugaku/rist
  fugaku.local: $spack/var/spack/fugaku-packages/repos/spack_repo/fugaku/local
  fugaku.update: $spack/var/spack/fugaku-packages/repos/spack_repo/fugaku/update
  builtin:
    git: https://github.com/spack/spack-packages.git
    branch: releases/v2025.07
    destination: $spack/var/spack/spack-packages
