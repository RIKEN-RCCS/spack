spack:
  specs:
  - py-tensorflow-hub%gcc@14.1.0
  - py-tensorflow-metadata%gcc@14.1.0
  - py-tensorflow-datasets%gcc@14.1.0 ^py-numpy@1.24.3
  concretizer:
    unify: when_possible
  view:
    default:
      root: .spack-env/view
      projections:
        all: "{name}-{version}-{hash:7}"
  config:
    build_jobs: 1
