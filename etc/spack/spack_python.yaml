spack:
  specs:
  - paraview+python~qt
  - py-tensorflow~cuda+mpi
  - py-tensorflow-estimator
  - py-tensorflow-probability@0.22 ^py-dm-tree@0.1.8%gcc@8.5.0
  - py-torch~cuda
  - py-botorch
  - py-efficientnet-pytorch
  - py-gpytorch
  - py-pytorch-gradual-warmup-lr
  - py-pytorch-lightning
  - py-pytorch-sphinx-theme
  - py-segmentation-models-pytorch
  - py-torch-cluster
  - py-torchdata
  - py-torchdiffeq
  - py-torchfile
  - py-torch-geometric
  - py-torchmetrics
  - py-torch-nvidia-apex~cuda
  - py-torch-scatter
  - py-torch-sparse
  - py-torch-spline-conv
  - py-torchsummary
  - py-torchtext
  - py-torchvision
  - py-vector-quantize-pytorch
  - py-torchgeo
  - py-torchaudio
  - py-scipy
  - py-numpy
  - py-mpi4py
  - py-matplotlib
  - py-ase
  - py-toml
  - py-scikit-learn
  - py-pandas
  concretizer:
    unify: when_possible
  view:
    default:
      root: .spack-env/view
      projections:
        all: "{name}-{version}-{hash:7}"
