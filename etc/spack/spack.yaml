spack:
  specs:
  - genesis
  - scale
  - gromacs
  - openfoam
  - openfoam-org
  - quantum-espresso
  - metis
  - parmetis
  - gsl
  - tmux
  - petsc ^openblas~ilp64
  - openbabel
  - gnuplot
  - lammps
  - julia ^openblas+ilp64
  - cp2k
  - cpmd+omp+mpi
  - frontistr
  - autodock-vina
  concretizer:
    unify: when_possible
  view:
    default:
      root: .spack-env/view
      projections:
        openfoam-org: "{name}"
        all: "{name}-{version}-{hash:7}"
