    - spec: '^libxkbcommon@0.9.2:'
      when: '%fj'
  openexr:
    require:
    - spec: ldflags="-lstdc++fs"
      when: '%fj'
  py-dask:
    require:
    - spec: ^arrow +parquet
      when: '%fj'
